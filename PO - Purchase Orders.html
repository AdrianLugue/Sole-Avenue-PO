                  <th data-column="status">
                    <div class="header-content">
                      <span>Status</span>
                      <span class="sort-icon">▲</span>
                      <i class="fi fi-rr-bars-filter filter-icon"></i>
                    </div>
                  </th>
                  <th data-column="itemCount">
                    <div class="header-content">
                      <span>Items</span>
                      <span class="sort-icon">▲</span>
                      <i class="fi fi-rr-bars-filter filter-icon"></i>
                    </div>
                  </th>
                  <th>
                    <div class="header-content">
                      <span>Received</span>
                    </div>
                  </th>
                  <th data-column="poTotal">
                    <div class="header-content">
                      <span>PO Total</span>
                      <span class="sort-icon">▲</span>
                      <i class="fi fi-rr-bars-filter filter-icon"></i>
                    </div>
                  </th>
                  <th data-column="deliveryDate">
                    <div class="header-content">
                      <span>Exp. Delivery</span>
                      <span class="sort-icon">▲</span>
                      <i class="fi fi-rr-bars-filter filter-icon"></i>
                    </div>
                  </th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr class="loading-row">
                  <td colspan="11">
                    <span class="spinner"></span> Loading purchase orders…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          </div>
        </div>

      </div><!-- /.main -->
    </div><!-- /.layout -->

    <!-- Vendor Summary Sidebar -->
    <div class="vendor-sidebar" id="vendorSidebar">
      <div class="vendor-sidebar-hd">
        <div>
          <div class="vendor-sidebar-name" id="vs-name"></div>
          <div class="vendor-sidebar-sub">Vendor Summary</div>
        </div>
        <button class="vendor-sidebar-close" onclick="closeVendorSidebar()">
          <i class="fi fi-rr-cross-small"></i>
        </button>
      </div>
      <div class="vendor-sidebar-body" id="vs-body"></div>
    </div>

    <!-- Bulk action bar -->
    <div class="bulk-bar" id="bulkBar">
      <span class="bulk-count" id="bulkCount">0 selected</span>
      <select class="bulk-select" id="bulkStatusSelect">
        <option value="">Set Status…</option>
        <option value="Draft">Draft</option>
        <option value="Issued">Issued</option>
        <option value="Partial">Partial</option>
        <option value="Closed">Closed</option>
      </select>
      <button class="bulk-btn" onclick="bulkChangeStatus()">Apply</button>
      <button class="bulk-btn danger" onclick="bulkDelete()">Delete</button>
      <button class="bulk-btn" onclick="bulkExportCSV()">Export CSV</button>
    </div>

    <script>
      let allPOs = [];
      let columnFilters = {};
      let activeDropdown = null;
      let currentSortColumn = null;
      let currentSortDirection = 'asc';

      // ── Navigation ──────────────────────────────────────────────
      const APP_URL = '<?= scriptUrl ?>';

      function navigate(page, po) {
        let url = APP_URL + '?page=' + page;
        if (po) url += '&po=' + encodeURIComponent(po);
        const a = document.createElement('a');
        a.href = url;
        a.target = '_top';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // ── Notification ─────────────────────────────────────────────
      function showNotif(msg, type) {
        const el = document.getElementById('notification');
        el.textContent = msg;
        el.className = 'notification ' + type;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
      }

      // ── Format currency ──────────────────────────────────────────
      function fmt(n) {
        return '₱' + parseFloat(n || 0).toLocaleString('en-PH', {
          minimumFractionDigits: 2, maximumFractionDigits: 2
        });
      }

      // ── Escape HTML ──────────────────────────────────────────────
      function esc(str) {
        return String(str || '')
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;');
      }

      // ── Load data ───────────────────────────────────────────────
      function loadData() {
        document.getElementById('lastUpdated').textContent = 'Loading data…';
        document.getElementById('tableBody').innerHTML =
          '<tr class="loading-row"><td colspan="11"><span class="spinner"></span> Loading purchase orders…</td></tr>';

        if (typeof google === 'undefined') {
          var mockData = [
            {
              poDate: '02/16/2026', po: 'PO-00011', reference: 'REF-001', vendor: 'Raven Tejada',
              status: 'Issued', deliveryDate: '03/01/2026', attention: 'John Doe',
              warehouse: 'Main Warehouse', deliveryInstructions: '',
              items: [
                {itemName: 'Adidas Samba Jane', sku: 'ADS-SJ-8', itemDesc: 'Classic samba silhouette', qty: 10, usageUnit: 'Pairs', rate: 5000, total: 50000},
                {itemName: 'Adidas Stan Smith',  sku: 'ADS-SS-9',  itemDesc: '',                        qty: 5,  usageUnit: 'Pairs', rate: 4500, total: 22500}
              ],
              itemCount: 2, poTotal: 72500, totalQtyOrdered: 15, qtyReceived: 6
            },
            {
              poDate: '02/16/2026', po: 'PO-00012', reference: 'REF-002', vendor: 'Nike Store',
              status: 'Draft', deliveryDate: '', attention: '',
              warehouse: 'Main Warehouse', deliveryInstructions: '',
              items: [
                {itemName: 'Air Jordan 1', sku: 'NKE-AJ1-9', itemDesc: '', qty: 5, usageUnit: 'Pairs', rate: 7500, total: 37500}
              ],
              itemCount: 1, poTotal: 37500, totalQtyOrdered: 5, qtyReceived: 0
            },
            {
              poDate: '02/15/2026', po: 'PO-00013', reference: 'REF-003', vendor: 'Adidas PH',
              status: 'Closed', deliveryDate: '03/10/2026', attention: '',
              warehouse: 'Cebu Branch', deliveryInstructions: '',
              items: [
                {itemName: 'Ultraboost 22', sku: 'ADS-UB22-7', itemDesc: '', qty: 8, usageUnit: 'Pairs', rate: 4500, total: 36000}
              ],
              itemCount: 1, poTotal: 36000, totalQtyOrdered: 8, qtyReceived: 8
            }
          ];

          allPOs = mockData;
          columnFilters = {};
          updateHeaderFilterIcons();
          renderTable(mockData);

          var now = new Date();
          document.getElementById('lastUpdated').textContent =
            'Last refreshed: ' + now.toLocaleTimeString() + ' (Mock Data)';
          return;
        }

        google.script.run
          .withSuccessHandler(function(data) {
            allPOs = data;
            columnFilters = {};
            updateHeaderFilterIcons();
            renderTable(data);
            var now = new Date();
            document.getElementById('lastUpdated').textContent =
              'Last refreshed: ' + now.toLocaleTimeString();
          })
          .withFailureHandler(function(err) {
            showNotif('Failed to load data: ' + err.message, 'error');
            document.getElementById('tableBody').innerHTML =
              '<tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--muted);">Failed to load data. Try refreshing.</td></tr>';
          })
          .getAllPOs();
      }

      // ── Column Header Filter ─────────────────────────────────────
      function setupColumnFilters() {
        var headers = document.querySelectorAll('thead th[data-column]');

        headers.forEach(function(header) {
          var filterIcon = header.querySelector('.filter-icon');
          if (filterIcon) {
            filterIcon.addEventListener('click', function(e) {
              e.stopPropagation();
              var column = header.getAttribute('data-column');

              if (activeDropdown && activeDropdown !== column) {
                closeFilterDropdown(activeDropdown);
              }
              if (activeDropdown === column) {
                closeFilterDropdown(column);
              } else {
                openFilterDropdown(column, header);
              }
            });
          }

          header.addEventListener('click', function(e) {
            if (e.target.closest('.filter-icon')) return;
            var column = this.getAttribute('data-column');

            if (activeDropdown) closeFilterDropdown(activeDropdown);

            if (currentSortColumn === column) {
              currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
              currentSortColumn = column;
              currentSortDirection = 'asc';
            }
            updateSortIcons();
            filterTable();
          });
        });
      }

      function openFilterDropdown(column, headerElement) {
        var values = [];
        var seen = {};
        allPOs.forEach(function(po) {
          var v = String(po[column] || '');
          if (!seen[v]) { seen[v] = true; values.push(v); }
        });
        values.sort();

        var dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown active';
        dropdown.id = 'filter-' + column;

        var content = document.createElement('div');
        content.className = 'filter-dropdown-content';

        var searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'filter-dropdown-search';
        searchInput.placeholder = 'Search...';
        content.appendChild(searchInput);

        var optionsContainer = document.createElement('div');

        values.forEach(function(value) {
          var option = document.createElement('label');
          option.className = 'filter-option';

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = value;

          if (!columnFilters[column] || columnFilters[column].indexOf(value) !== -1) {
            checkbox.checked = true;
          }

          var label = document.createElement('span');
          label.textContent = value || '(Empty)';

          option.appendChild(checkbox);
          option.appendChild(label);
          optionsContainer.appendChild(option);
        });

        content.appendChild(optionsContainer);
        dropdown.appendChild(content);

        var actions = document.createElement('div');
        actions.className = 'filter-actions';

        var clearBtn = document.createElement('button');
        clearBtn.className = 'filter-btn';
        clearBtn.textContent = 'Clear';
        clearBtn.onclick = function() {
          delete columnFilters[column];
          closeFilterDropdown(column);
          updateHeaderFilterIcons();
          filterTable();
        };

        var applyBtn = document.createElement('button');
        applyBtn.className = 'filter-btn';
        applyBtn.textContent = 'Apply';
        applyBtn.onclick = function() {
          var checkedValues = Array.from(
            dropdown.querySelectorAll('input[type="checkbox"]:checked')
          ).map(function(cb) { return cb.value; });

          if (checkedValues.length === values.length) {
            delete columnFilters[column];
          } else {
            columnFilters[column] = checkedValues;
          }

          closeFilterDropdown(column);
          updateHeaderFilterIcons();
          filterTable();
        };

        actions.appendChild(clearBtn);
        actions.appendChild(applyBtn);
        dropdown.appendChild(actions);

        searchInput.addEventListener('input', function() {
          var searchTerm = this.value.toLowerCase();
          var options = optionsContainer.querySelectorAll('.filter-option');

          options.forEach(function(opt) {
            var text = opt.textContent.toLowerCase();
            opt.style.display = text.includes(searchTerm) ? 'flex' : 'none';
          });
        });

        document.body.appendChild(dropdown);

        var rect = headerElement.getBoundingClientRect();
        dropdown.style.left = rect.left + 'px';
        dropdown.style.top = (rect.bottom + 2) + 'px';

        activeDropdown = column;

        dropdown.addEventListener('click', function(e) {
          e.stopPropagation();
        });
      }

      function closeFilterDropdown(column) {
        var dropdown = document.getElementById('filter-' + column);
        if (dropdown) {
          dropdown.remove();
        }
        if (activeDropdown === column) {
          activeDropdown = null;
        }
      }

      function updateHeaderFilterIcons() {
        var headers = document.querySelectorAll('thead th[data-column]');
        headers.forEach(function(header) {
          var column = header.getAttribute('data-column');
          if (columnFilters[column]) {
            header.classList.add('filtered');
          } else {
            header.classList.remove('filtered');
          }
        });
      }

      // ── Sort helpers ─────────────────────────────────────────────
      function parseDateMMDDYYYY(str) {
        if (!str) return 0;
        var parts = String(str).split('/');
        if (parts.length === 3) return new Date(parts[2], parts[0] - 1, parts[1]).getTime();
        return 0;
      }

      function sortData(data) {
        if (!currentSortColumn) return data;
        var col = currentSortColumn;
        var dir = currentSortDirection === 'asc' ? 1 : -1;
        var numericCols = { poTotal: true, itemCount: true };
        var dateCols = { poDate: true, deliveryDate: true };

        return data.slice().sort(function(a, b) {
          var va = a[col], vb = b[col];
          if (numericCols[col]) {
            return (parseFloat(va || 0) - parseFloat(vb || 0)) * dir;
          }
          if (dateCols[col]) {
            return (parseDateMMDDYYYY(va) - parseDateMMDDYYYY(vb)) * dir;
          }
          return String(va || '').localeCompare(String(vb || '')) * dir;
        });
      }

      function updateSortIcons() {
        var headers = document.querySelectorAll('thead th[data-column]');
        headers.forEach(function(th) {
          var col = th.getAttribute('data-column');
          var icon = th.querySelector('.sort-icon');
          th.classList.remove('sort-asc', 'sort-desc');
          if (col === currentSortColumn) {
            th.classList.add(currentSortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
            if (icon) icon.textContent = currentSortDirection === 'asc' ? '▲' : '▼';
          } else {
            if (icon) icon.textContent = '▲';
          }
        });
      }

      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (activeDropdown && !e.target.closest('thead th')) {
          closeFilterDropdown(activeDropdown);
        }
      });

      // ── Render table rows ────────────────────────────────────────
      function renderTable(data) {
        var tbody = document.getElementById('tableBody');
        var poEmpty = document.getElementById('poEmpty');
        var poTable = document.getElementById('poTable');
        document.getElementById('selectAll').checked = false;
        updateBulkBar();

        if (!data || data.length === 0) {
          tbody.innerHTML = '';
          poEmpty.style.display = '';
          poTable.style.display = 'none';
          return;
        }

        poEmpty.style.display = 'none';
        poTable.style.display = '';

        var todayMs = new Date().setHours(0, 0, 0, 0);

        tbody.innerHTML = data.map(function(po) {
          var s = po.status;
          var deliveryTs = parseDateMMDDYYYY(po.deliveryDate);
          var isOverdue = s !== 'Closed' && deliveryTs > 0 && deliveryTs < todayMs;
          var selClass = s === 'Draft' ? 'draft-sel' : s === 'Issued' ? 'issued-sel' : s === 'Partial' ? 'partial-sel' : 'closed-sel';
          var opts = '';
          if (s === 'Draft') {
            opts = '<option value="Draft" selected>Draft</option><option value="Issued">Issued</option><option value="Partial">Partial</option><option value="Closed">Closed</option>';
          } else if (s === 'Issued') {
            opts = '<option value="Issued" selected>Issued</option><option value="Partial">Partial</option><option value="Closed">Closed</option>';
          } else if (s === 'Partial') {
            opts = '<option value="Partial" selected>Partial</option><option value="Closed">Closed</option>';
          } else {
            opts = '<option value="Closed" selected>Closed</option>';
          }
          var receivedDisplay = (po.qtyReceived || 0) + '/' + (po.totalQtyOrdered || 0);
          var selectHtml = '<select class="status-select ' + selClass + '" data-po="' + esc(po.po) + '" data-current="' + esc(s) + '" onchange="onStatusSelect(this)"' + (s === 'Closed' ? ' disabled' : '') + '>' + opts + '</select>';

          return '<tr data-po="' + esc(po.po) + '"' + (isOverdue ? ' class="overdue-row"' : '') + '>' +
            '<td class="td-check"><input type="checkbox" class="row-check" data-po="' + esc(po.po) + '" onchange="updateBulkBar()"></td>' +
            '<td class="date-col">' + esc(po.poDate) + '</td>' +
            '<td class="po-num">' + esc(po.po) + '</td>' +
            '<td>' + esc(po.reference) + '</td>' +
            '<td class="vendor-cell" data-vendor="' + esc(po.vendor) + '"><span class="vendor-link">' + esc(po.vendor) + '</span></td>' +
            '<td><span class="badge ' + esc(po.status) + '">' + esc(po.status) + '</span></td>' +
            '<td><div style="display:flex;flex-direction:column;align-items:flex-start;gap:3px;">' +
              '<span class="badge-count">' + po.itemCount + ' item' + (po.itemCount === 1 ? '' : 's') + '</span>' +
              ((po.unexpectedCount || 0) > 0 ? '<span class="badge-unexpected">+' + po.unexpectedCount + '</span>' : '') +
            '</div></td>' +
            '<td>' + receivedDisplay + '</td>' +
            '<td>' + fmt(po.poTotal) + '</td>' +
            '<td class="date-col">' + (po.deliveryDate ? (isOverdue ? '<span class="overdue-date"><i class="fi fi-sr-triangle-warning"></i>' + esc(po.deliveryDate) + '</span>' : esc(po.deliveryDate)) : '—') + '</td>' +
            '<td style="display:flex;gap:6px;align-items:center;">' +
              selectHtml +
              '<button class="btn-receive-row" data-po="' + esc(po.po) + '">Receive</button>' +
              '<button class="btn-edit-row" data-po="' + esc(po.po) + '">Edit</button>' +
            '</td>' +
          '</tr>';
        }).join('');

        tbody.querySelectorAll('.btn-receive-row').forEach(function(btn) {
          btn.addEventListener('click', function() {
            navigate('receives', this.getAttribute('data-po'));
          });
        });

        tbody.querySelectorAll('.btn-edit-row').forEach(function(btn) {
          btn.addEventListener('click', function() {
            navigate('edit', this.getAttribute('data-po'));
          });
        });

        tbody.querySelectorAll('.vendor-cell').forEach(function(cell) {
          cell.addEventListener('click', function(e) {
            e.stopPropagation();
            openVendorSidebar(this.getAttribute('data-vendor'));
          });
        });

        tbody.querySelectorAll('tr[data-po]').forEach(function(tr) {
          tr.addEventListener('click', function(e) {
            if (e.target.closest('.td-check') ||
                e.target.closest('.btn-edit-row') ||
                e.target.closest('.btn-receive-row') ||
                e.target.closest('.status-select')) return;
            openDetailModal(this.getAttribute('data-po'));
          });
        });

        var tw = document.getElementById('tableWrap');
        if (tw && tw._updateFade) tw._updateFade();
      }

      // ── Filter ───────────────────────────────────────────────────
      function filterTable() {
        var q      = document.getElementById('searchInput').value.toLowerCase().trim();
        var status = document.getElementById('statusFilter').value;

        var filtered = allPOs.filter(function(po) {
          var itemNames = Array.isArray(po.items)
            ? po.items.map(function(it) { return String(it.itemName || ''); }).join(' ')
            : '';
          var matchText = !q ||
            String(po.po).toLowerCase().includes(q) ||
            String(po.vendor).toLowerCase().includes(q) ||
            itemNames.toLowerCase().includes(q) ||
            String(po.reference).toLowerCase().includes(q);

          var matchStatus = !status || po.status === status;

          var matchColumnFilters = true;
          for (var col in columnFilters) {
            var cellValue = String(po[col] || '');
            if (columnFilters[col].indexOf(cellValue) === -1) {
              matchColumnFilters = false;
              break;
            }
          }

          return matchText && matchStatus && matchColumnFilters;
        });

        filtered = filterByDateRange(filtered);
        renderTable(sortData(filtered));
      }

      // ── Autocomplete ───────────────────────────────────────────
      var acIndex = -1;

      function onSearchInput() {
        filterTable();
        showAutocomplete();
      }

      function onSearchFocus() {
        var q = document.getElementById('searchInput').value.trim();
        if (q.length > 0) showAutocomplete();
      }

      function showAutocomplete() {
        var input = document.getElementById('searchInput');
        var list  = document.getElementById('acList');
        var q     = input.value.toLowerCase().trim();
        acIndex   = -1;

        if (!q || allPOs.length === 0) {
          closeAutocomplete();
          return;
        }

        // Deduplicate by PO number (allPOs may have grouped entries)
        var seen = {};
        var matches = [];
        for (var i = 0; i < allPOs.length && matches.length < 8; i++) {
          var po = allPOs[i];
          var poNum = String(po.po || '');
          if (seen[poNum]) continue;
          var vendor = String(po.vendor || '');
          var ref    = String(po.reference || '');
          if (poNum.toLowerCase().includes(q) || vendor.toLowerCase().includes(q) || ref.toLowerCase().includes(q)) {
            seen[poNum] = true;
            matches.push(po);
          }
        }

        if (matches.length === 0) {
          list.innerHTML = '<div class="ac-empty">No matching POs found</div>';
          list.classList.add('visible');
          input.classList.add('ac-open');
          return;
        }

        list.innerHTML = matches.map(function(po, idx) {
          var statusClass = esc(po.status || '');
          return '<div class="autocomplete-item" data-idx="' + idx + '" onmousedown="selectAutocomplete(\'' + esc(po.po) + '\')">'
            + '<span class="ac-po">' + esc(po.po) + '</span>'
            + '<span class="ac-vendor">' + esc(po.vendor) + '</span>'
            + '<span class="ac-status ' + statusClass + '">' + esc(po.status) + '</span>'
            + '</div>';
        }).join('');

        list.classList.add('visible');
        input.classList.add('ac-open');
      }

      function selectAutocomplete(poNum) {
        var input = document.getElementById('searchInput');
        input.value = poNum;
        closeAutocomplete();
        filterTable();
      }

      function closeAutocomplete() {
        var list  = document.getElementById('acList');
        var input = document.getElementById('searchInput');
        list.classList.remove('visible');
        list.innerHTML = '';
        input.classList.remove('ac-open');
        acIndex = -1;
      }

      // Keyboard navigation for autocomplete
      document.getElementById('searchInput').addEventListener('keydown', function(e) {
        var list  = document.getElementById('acList');
        var items = list.querySelectorAll('.autocomplete-item');
        if (!list.classList.contains('visible') || items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          acIndex = Math.min(acIndex + 1, items.length - 1);
          updateAcHighlight(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          acIndex = Math.max(acIndex - 1, 0);
          updateAcHighlight(items);
        } else if (e.key === 'Enter' && acIndex >= 0) {
          e.preventDefault();
          items[acIndex].onmousedown();
        } else if (e.key === 'Escape') {
          closeAutocomplete();
        }
      });

      function updateAcHighlight(items) {
        items.forEach(function(el, i) {
          el.classList.toggle('active', i === acIndex);
        });
        if (acIndex >= 0 && items[acIndex]) {
          items[acIndex].scrollIntoView({ block: 'nearest' });
        }
      }

      // Close autocomplete when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrap')) closeAutocomplete();
      });

      // ── Status workflow ──────────────────────────────────────────
      var pendingStatusSelect = null;
      var STATUS_ORDER = { 'Draft': 0, 'Issued': 1, 'Partial': 2, 'Closed': 3 };

      function onStatusSelect(sel) {
        var newStatus = sel.value;
        var currentStatus = sel.getAttribute('data-current');
        if (newStatus === currentStatus) return;

        pendingStatusSelect = sel;
        var poNumber = sel.getAttribute('data-po');

        var msg = 'Change ' + poNumber + ' from ' + currentStatus + ' to ' + newStatus + '?';

        // Fix 7: warn on backwards transitions
        if ((STATUS_ORDER[newStatus] || 0) < (STATUS_ORDER[currentStatus] || 0)) {
          msg += '\n\nWarning: This is a backwards status change. Re-opening a ' + currentStatus + ' PO will not reverse any inventory updates.';
        }

        // Fix 3: warn when manually closing without full receiving
        if (newStatus === 'Closed') {
          var po = allPOs.find(function(p) { return p.po === poNumber; });
          if (po && (po.qtyReceived || 0) < (po.totalQtyOrdered || 0)) {
            msg += '\n\nNote: This PO has unreceived items. Closing it manually will NOT update inventory. Use the Receives page to update inventory.';
          }
        }

        document.getElementById('modalTitle').textContent = 'Change Status';
        document.getElementById('modalMsg').textContent = msg;
        document.getElementById('statusModal').classList.add('active');
      }

      function closeStatusModal() {
        document.getElementById('statusModal').classList.remove('active');
        document.getElementById('modalConfirmBtn').onclick = confirmStatusChange;
        if (pendingStatusSelect) {
          pendingStatusSelect.value = pendingStatusSelect.getAttribute('data-current');
          pendingStatusSelect = null;
        }
      }

      function confirmStatusChange() {
        var sel = pendingStatusSelect;
        if (!sel) return;

        var poNumber = sel.getAttribute('data-po');
        var newStatus = sel.value;
        var oldStatus = sel.getAttribute('data-current');

        document.getElementById('statusModal').classList.remove('active');
        sel.disabled = true;

        function onSuccess(result) {
          if (result === 'Success') {
            allPOs.forEach(function(po) {
              if (po.po === poNumber) po.status = newStatus;
            });
            showNotif(poNumber + ' marked as ' + newStatus, 'success');
            filterTable();
          } else {
            showNotif(result || 'Failed to update status', 'error');
            sel.value = oldStatus;
            sel.disabled = false;
          }
          pendingStatusSelect = null;
        }

        function onFailure(err) {
          showNotif('Error: ' + err.message, 'error');
          sel.value = oldStatus;
          sel.disabled = false;
          pendingStatusSelect = null;
        }

        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .updatePOStatus(poNumber, newStatus);
        } else {
          setTimeout(function() { onSuccess('Success'); }, 500);
        }
      }

      // ── Bulk Actions ─────────────────────────────────────────────
      function toggleSelectAll(masterCheckbox) {
        var checks = document.querySelectorAll('.row-check:not(#selectAll)');
        checks.forEach(function(cb) { cb.checked = masterCheckbox.checked; });
        updateBulkBar();
      }

      function updateBulkBar() {
        var count = getSelectedPOs().length;
        var bar = document.getElementById('bulkBar');
        var countEl = document.getElementById('bulkCount');
        countEl.textContent = count + ' selected';
        if (count > 0) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
          document.getElementById('bulkStatusSelect').value = '';
        }
      }

      function getSelectedPOs() {
        var checks = document.querySelectorAll('.row-check:not(#selectAll):checked');
        return Array.from(checks).map(function(cb) { return cb.getAttribute('data-po'); });
      }

      function bulkChangeStatus() {
        var newStatus = document.getElementById('bulkStatusSelect').value;
        if (!newStatus) { showNotif('Please select a status first.', 'error'); return; }
        var selected = getSelectedPOs();
        if (selected.length === 0) return;

        document.getElementById('modalTitle').textContent = 'Bulk Status Change';
        document.getElementById('modalMsg').textContent =
          'Change ' + selected.length + ' PO(s) to ' + newStatus + '?';

        document.getElementById('statusModal').classList.add('active');
        document.getElementById('modalConfirmBtn').onclick = function() {
          document.getElementById('statusModal').classList.remove('active');
          document.getElementById('modalConfirmBtn').onclick = confirmStatusChange;
          var completed = 0, failed = 0, total = selected.length;

          function onDone() {
            completed++;
            if (completed === total) {
              if (failed > 0) showNotif(failed + ' of ' + total + ' failed to update.', 'error');
              else showNotif(selected.length + ' PO(s) updated to ' + newStatus, 'success');
              document.getElementById('bulkStatusSelect').value = '';
              filterTable();
              updateBulkBar();
            }
          }

          selected.forEach(function(poNum) {
            if (typeof google !== 'undefined') {
              google.script.run
                .withSuccessHandler(function(result) {
                  if (result === 'Success') {
                    allPOs.forEach(function(po) { if (po.po === poNum) po.status = newStatus; });
                  } else { failed++; }
                  onDone();
                })
                .withFailureHandler(function() { failed++; onDone(); })
                .updatePOStatus(poNum, newStatus);
            } else {
              allPOs.forEach(function(po) { if (po.po === poNum) po.status = newStatus; });
              setTimeout(onDone, 200);
            }
          });
        };
      }

      function bulkDelete() {
        var selected = getSelectedPOs();
        if (selected.length === 0) return;

        document.getElementById('modalTitle').textContent = 'Bulk Delete';
        document.getElementById('modalMsg').textContent =
          'Permanently delete ' + selected.length + ' PO(s)? This cannot be undone.';
        document.getElementById('statusModal').classList.add('active');
        document.getElementById('modalConfirmBtn').onclick = function() {
          document.getElementById('statusModal').classList.remove('active');
          document.getElementById('modalConfirmBtn').onclick = confirmStatusChange;
          var completed = 0, failed = 0, total = selected.length;

          function onDone() {
            completed++;
            if (completed === total) {
              if (failed > 0) showNotif(failed + ' of ' + total + ' failed to delete.', 'error');
              else showNotif(selected.length + ' PO(s) deleted.', 'success');
              filterTable();
              updateBulkBar();
            }
          }

          selected.forEach(function(poNum) {
            if (typeof google !== 'undefined') {
              google.script.run
                .withSuccessHandler(function(result) {
                  if (result === 'Success') {
                    allPOs = allPOs.filter(function(po) { return po.po !== poNum; });
                  } else { failed++; }
                  onDone();
                })
                .withFailureHandler(function() { failed++; onDone(); })
                .deletePO(poNum);
            } else {
              allPOs = allPOs.filter(function(po) { return po.po !== poNum; });
              setTimeout(onDone, 200);
            }
          });
        };
      }

      function bulkExportCSV() {
        var selected = getSelectedPOs();
        if (selected.length === 0) return;
        var rows = allPOs.filter(function(po) { return selected.indexOf(po.po) !== -1; });
        downloadCSV(rows);
      }

      // ── Date Range Filter ──────────────────────────────────────────
      var activeDateRange = 'all';
      var customDateFrom = null;
      var customDateTo = null;

      function setDateRange(range, btnEl) {
        activeDateRange = range;

        if (btnEl) {
          document.querySelectorAll('.date-preset').forEach(function(b) { b.classList.remove('active'); });
          btnEl.classList.add('active');
        }

        if (range === 'custom') {
          document.querySelectorAll('.date-preset').forEach(function(b) { b.classList.remove('active'); });
          customDateFrom = document.getElementById('dateFrom').value || null;
          customDateTo = document.getElementById('dateTo').value || null;
        } else {
          document.getElementById('dateFrom').value = '';
          document.getElementById('dateTo').value = '';
          customDateFrom = null;
          customDateTo = null;
        }

        filterTable();
      }

      function parsePODate(dateStr) {
        if (!dateStr) return null;
        var parts = String(dateStr).split('/');
        if (parts.length !== 3) return null;
        return new Date(parseInt(parts[2]), parseInt(parts[0]) - 1, parseInt(parts[1]));
      }

      function getDateRange() {
        var now = new Date();
        var from = null, to = null;

        if (activeDateRange === 'custom') {
          from = customDateFrom ? new Date(customDateFrom + 'T00:00:00') : null;
          to = customDateTo ? new Date(customDateTo + 'T23:59:59') : null;
        } else if (activeDateRange === 'week') {
          var day = now.getDay();
          from = new Date(now);
          from.setDate(now.getDate() - day);
          from.setHours(0, 0, 0, 0);
          to = new Date(now);
          to.setHours(23, 59, 59, 999);
        } else if (activeDateRange === 'month') {
          from = new Date(now.getFullYear(), now.getMonth(), 1);
          to = new Date(now);
          to.setHours(23, 59, 59, 999);
        } else if (activeDateRange === 'quarter') {
          var qMonth = Math.floor(now.getMonth() / 3) * 3;
          from = new Date(now.getFullYear(), qMonth, 1);
          to = new Date(now);
          to.setHours(23, 59, 59, 999);
        }
        return { from: from, to: to };
      }

      function filterByDateRange(poList) {
        if (activeDateRange === 'all') return poList;
        var range = getDateRange();
        return poList.filter(function(po) {
          var d = parsePODate(po.poDate);
          if (!d) return false;
          if (range.from && d < range.from) return false;
          if (range.to && d > range.to) return false;
          return true;
        });
      }

      // ── PO Detail Modal ──────────────────────────────────────────────
      function openDetailModal(poNumber) {
        var po = allPOs.find(function(p) { return p.po === poNumber; });
        if (!po) return;

        document.getElementById('dm-po').textContent = po.po;
        document.getElementById('dm-date').textContent = 'PO Date: ' + (po.poDate || '—');

        var statusEl = document.getElementById('dm-status');
        statusEl.textContent = po.status || '—';
        statusEl.className = 'badge ' + (po.status || '');

        document.getElementById('dm-edit-btn').onclick = function() {
          closeDetailModal();
          navigate('edit', po.po);
        };

        var fields = [
          { label: 'Reference #',           value: po.reference || '' },
          { label: 'Expected Delivery',     value: po.deliveryDate || '' },
          { label: 'Vendor',                value: po.vendor || '' },
          { label: 'Attention',             value: po.attention || '' },
          { label: 'Warehouse',             value: po.warehouse || '' },
          { label: 'Delivery Instructions', value: po.deliveryInstructions || '' }
        ];
        document.getElementById('dm-order-grid').innerHTML = fields.map(function(f) {
          var empty = !f.value;
          return '<div class="detail-field">' +
            '<div class="detail-field-label">' + esc(f.label) + '</div>' +
            '<div class="detail-field-value' + (empty ? ' empty' : '') + '">' +
              (empty ? 'Not specified' : esc(f.value)) +
            '</div></div>';
        }).join('');

        var items = po.items || [];
        if (items.length === 0) {
          document.getElementById('dm-items-body').innerHTML =
            '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted);">No line items.</td></tr>';
        } else {
          document.getElementById('dm-items-body').innerHTML = items.map(function(item) {
            var lineTotal = item.total || ((item.qty || 0) * (item.rate || 0));
            return '<tr>' +
              '<td><div class="detail-item-name">' + esc(item.itemName || '—') + '</div>' +
                (item.itemDesc ? '<div class="detail-item-meta">' + esc(item.itemDesc) + '</div>' : '') +
              '</td>' +
              '<td><span class="detail-item-meta">' + esc(item.sku || '—') + '</span></td>' +
              '<td>' + esc(item.usageUnit || '—') + '</td>' +
              '<td>' + (item.qty || 0) + '</td>' +
              '<td class="td-right">' + fmt(item.rate) + '</td>' +
              '<td class="td-right">' + fmt(lineTotal) + '</td>' +
              '</tr>';
          }).join('');
        }

        document.getElementById('dm-total').textContent = fmt(po.poTotal);
        document.getElementById('detailModal').classList.add('active');
      }

      function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('active');
      }

      // ── Export CSV ──────────────────────────────────────────────────
      function exportCSV() {
        var data = getFilteredData();
        downloadCSV(data);
      }

      function getFilteredData() {
        var q = document.getElementById('searchInput').value.toLowerCase().trim();
        var status = document.getElementById('statusFilter').value;

        var filtered = allPOs.filter(function(po) {
          var itemNames = Array.isArray(po.items)
            ? po.items.map(function(it) { return String(it.itemName || ''); }).join(' ')
            : '';
          var matchText = !q ||
            String(po.po).toLowerCase().includes(q) ||
            String(po.vendor).toLowerCase().includes(q) ||
            itemNames.toLowerCase().includes(q) ||
            String(po.reference).toLowerCase().includes(q);
          var matchStatus = !status || po.status === status;
          var matchColumnFilters = true;
          for (var col in columnFilters) {
            var cellValue = String(po[col] || '');
            if (columnFilters[col].indexOf(cellValue) === -1) {
              matchColumnFilters = false;
              break;
            }
          }
          return matchText && matchStatus && matchColumnFilters;
        });

        return filterByDateRange(filtered);
      }

      function downloadCSV(data) {
        if (!data || data.length === 0) {
          showNotif('No data to export.', 'error');
          return;
        }
        var headers = ['PO Date', 'PO Number', 'Reference#', 'Vendor', 'Status', 'Items', 'Items Received', 'PO Total', 'Expected Delivery'];
        var csvRows = [headers.join(',')];
        data.forEach(function(po) {
          var itemNames = Array.isArray(po.items)
            ? po.items.map(function(it) { return it.itemName || ''; }).join('; ')
            : '';
          var row = [
            '"' + (po.poDate || '') + '"',
            '"' + (po.po || '') + '"',
            '"' + (po.reference || '') + '"',
            '"' + (po.vendor || '').replace(/"/g, '""') + '"',
            '"' + (po.status || '') + '"',
            '"' + itemNames.replace(/"/g, '""') + '"',
            '"' + (po.qtyReceived || 0) + '/' + (po.totalQtyOrdered || 0) + '"',
            po.poTotal || 0,
            '"' + (po.deliveryDate || '') + '"'
          ];
          csvRows.push(row.join(','));
        });

        var csvString = csvRows.join('\n');
        var blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var today = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = 'PO_Export_' + today + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotif('CSV exported (' + data.length + ' rows)', 'success');
      }

      // ── Vendor Summary Sidebar ────────────────────────────────
      function openVendorSidebar(vendorName) {
        var pos = allPOs.filter(function(po) { return po.vendor === vendorName; });
        var totalPOs = pos.length;
        var totalSpend = pos.reduce(function(sum, po) { return sum + parseFloat(po.poTotal || 0); }, 0);
        var avgPO = totalPOs > 0 ? totalSpend / totalPOs : 0;
        var statusCounts = { Draft: 0, Issued: 0, Partial: 0, Closed: 0 };
        pos.forEach(function(po) {
          if (statusCounts.hasOwnProperty(po.status)) statusCounts[po.status]++;
        });
        var openPOs = statusCounts.Draft + statusCounts.Issued + statusCounts.Partial;

        // Fulfillment
        var totalOrdered  = pos.reduce(function(s, po) { return s + (parseInt(po.totalQtyOrdered) || 0); }, 0);
        var totalReceived = pos.reduce(function(s, po) { return s + (parseInt(po.qtyReceived)     || 0); }, 0);
        var receiveRate   = totalOrdered > 0 ? Math.round((totalReceived / totalOrdered) * 100) : 0;

        // Overdue POs
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var overduePOs = pos.filter(function(po) {
          if (po.status === 'Closed') return false;
          if (!po.deliveryDate) return false;
          var d = parseDateMMDDYYYY(po.deliveryDate);
          return d > 0 && d < today.getTime();
        }).length;

        // First / Last order
        var datedPOs = pos.filter(function(po) { return po.poDate; })
          .sort(function(a, b) { return parseDateMMDDYYYY(a.poDate) - parseDateMMDDYYYY(b.poDate); });
        var firstOrder = datedPOs.length > 0 ? datedPOs[0].poDate : '—';
        var lastOrder  = datedPOs.length > 0 ? datedPOs[datedPOs.length - 1].poDate : '—';

        // Warehouses
        var warehouseSeen = {}, warehouses = [];
        pos.forEach(function(po) {
          if (po.warehouse && !warehouseSeen[po.warehouse]) {
            warehouseSeen[po.warehouse] = true;
            warehouses.push(po.warehouse);
          }
        });

        // Top items by qty
        var itemTotals = {};
        pos.forEach(function(po) {
          if (Array.isArray(po.items)) {
            po.items.forEach(function(item) {
              var n = item.itemName || 'Unknown';
              if (!itemTotals[n]) itemTotals[n] = 0;
              itemTotals[n] += (parseInt(item.qty) || 0);
            });
          }
        });
        var topItems = Object.keys(itemTotals)
          .map(function(n) { return { name: n, qty: itemTotals[n] }; })
          .sort(function(a, b) { return b.qty - a.qty; })
          .slice(0, 3);

        document.getElementById('vs-name').textContent = vendorName || '—';

        var statusColors = {
          Draft: 'oklch(72% 0 0)', Issued: 'oklch(42% 0 0)',
          Partial: 'oklch(58% 0 0)', Closed: 'oklch(14% 0 0)'
        };

        // ── Section 1: Stats (2×2 grid) ──
        var statsHtml =
          '<div class="vendor-stats">' +
            '<div class="vendor-stat"><div class="vendor-stat-label">Total POs</div><div class="vendor-stat-value">' + totalPOs + '</div></div>' +
            '<div class="vendor-stat"><div class="vendor-stat-label">Open POs</div><div class="vendor-stat-value">' + openPOs + '</div></div>' +
            '<div class="vendor-stat"><div class="vendor-stat-label">Total Spend</div><div class="vendor-stat-value">' + fmt(totalSpend) + '</div></div>' +
            '<div class="vendor-stat"><div class="vendor-stat-label">Avg. PO Value</div><div class="vendor-stat-value">' + fmt(avgPO) + '</div></div>' +
          '</div>';

        // ── Section 2: Fulfillment ──
        var fulfillHtml = totalOrdered > 0
          ? '<div class="vendor-section-title">Fulfillment</div>' +
            '<div>' +
              '<div class="vendor-fulfill-bar-wrap">' +
                '<div class="vendor-fulfill-bar-fill" style="width:' + receiveRate + '%"></div>' +
              '</div>' +
              '<div class="vendor-fulfill-meta">' +
                '<span>' + totalReceived + ' / ' + totalOrdered + ' items received</span>' +
                '<span class="vendor-fulfill-pct">' + receiveRate + '%</span>' +
              '</div>' +
            '</div>'
          : '';

        // ── Section 3: Status Breakdown ──
        var breakdownHtml = totalPOs > 0
          ? '<div class="vendor-section-title">Status Breakdown</div>' +
            '<div class="vendor-status-breakdown">' +
            ['Draft', 'Issued', 'Partial', 'Closed'].map(function(s) {
              var count = statusCounts[s];
              var pct = Math.round((count / totalPOs) * 100);
              return '<div class="vendor-status-row">' +
                '<span class="vendor-status-label">' + s + '</span>' +
                '<div class="vendor-status-bar-wrap"><div class="vendor-status-bar-fill" style="width:' + pct + '%;background:' + statusColors[s] + '"></div></div>' +
                '<span class="vendor-status-count">' + count + '</span>' +
              '</div>';
            }).join('') +
            '</div>'
          : '';

        // ── Section 4: Vendor Details ──
        var overdueStr = overduePOs > 0
          ? '<span class="vendor-overdue-tag"><i class="fi fi-sr-triangle-warning" style="font-size:0.6rem"></i> ' + overduePOs + ' overdue</span>'
          : '<span style="color:var(--muted);font-size:0.78rem;font-weight:500">None</span>';

        var factsHtml =
          '<div class="vendor-section-title">Vendor Details</div>' +
          '<div class="vendor-facts">' +
            '<div class="vendor-fact-row"><span class="vendor-fact-label">First Order</span><span class="vendor-fact-value">' + esc(firstOrder) + '</span></div>' +
            '<div class="vendor-fact-row"><span class="vendor-fact-label">Last Order</span><span class="vendor-fact-value">' + esc(lastOrder) + '</span></div>' +
            (warehouses.length > 0
              ? '<div class="vendor-fact-row"><span class="vendor-fact-label">Warehouse</span><span class="vendor-fact-value">' + esc(warehouses.join(', ')) + '</span></div>'
              : '') +
            '<div class="vendor-fact-row"><span class="vendor-fact-label">Overdue</span><span class="vendor-fact-value">' + overdueStr + '</span></div>' +
          '</div>';

        // ── Section 5: Top Items ──
        var topItemsHtml = topItems.length > 0
          ? '<div class="vendor-section-title">Top Items by Qty</div>' +
            '<div class="vendor-top-items">' +
            topItems.map(function(item, i) {
              return '<div class="vendor-top-item">' +
                '<span class="vendor-top-item-rank">' + (i + 1) + '</span>' +
                '<span class="vendor-top-item-name">' + esc(item.name) + '</span>' +
                '<span class="vendor-top-item-qty">' + item.qty + ' pcs</span>' +
              '</div>';
            }).join('') +
            '</div>'
          : '';

        // ── Section 6: PO List ──
        var sortedPOs = pos.slice().sort(function(a, b) {
          return parseDateMMDDYYYY(b.poDate) - parseDateMMDDYYYY(a.poDate);
        });
        var poListHtml =
          '<div class="vendor-section-title">Purchase Orders</div>' +
          '<div class="vendor-po-list">' +
          (sortedPOs.length === 0
            ? '<p style="font-size:0.82rem;color:var(--muted);">No POs found.</p>'
            : sortedPOs.map(function(po) {
                return '<div class="vendor-po-item" onclick="closeVendorSidebar();setTimeout(function(){openDetailModal(\'' + esc(po.po).replace(/'/g, "\\'") + '\')},280)">' +
                  '<div class="vendor-po-info">' +
                    '<div class="vendor-po-num">' + esc(po.po) + '</div>' +
                    '<div class="vendor-po-date">' + esc(po.poDate || '—') + '</div>' +
                  '</div>' +
                  '<span class="badge ' + esc(po.status) + '">' + esc(po.status) + '</span>' +
                  '<div class="vendor-po-total">' + fmt(po.poTotal) + '</div>' +
                '</div>';
              }).join('')
          ) +
          '</div>';

        document.getElementById('vs-body').innerHTML =
          statsHtml + fulfillHtml + breakdownHtml + factsHtml + topItemsHtml + poListHtml;

        document.getElementById('vendorSidebar').classList.add('active');
      }

      function closeVendorSidebar() {
        document.getElementById('vendorSidebar').classList.remove('active');
      }

      // Close sidebar when clicking outside
      document.addEventListener('click', function(e) {
        var sidebar = document.getElementById('vendorSidebar');
        if (sidebar.classList.contains('active') &&
            !e.target.closest('#vendorSidebar') &&
            !e.target.closest('.vendor-cell')) {
          closeVendorSidebar();
        }
      });

      // ── Disable browser autocomplete on all inputs ────────────
      document.querySelectorAll('input, select').forEach(function(el) { el.setAttribute('autocomplete', 'nope'); });
      new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(n) {
            if (n.nodeType === 1) {
              if (n.matches && n.matches('input,select')) n.setAttribute('autocomplete', 'nope');
              if (n.querySelectorAll) n.querySelectorAll('input,select').forEach(function(el) { el.setAttribute('autocomplete', 'nope'); });
            }
          });
        });
      }).observe(document.body, { childList: true, subtree: true });

      // ── Table fade ───────────────────────────────────────────────
      function setupTableFade() {
        var wrap  = document.getElementById('tableWrap');
        var outer = document.getElementById('tableWrapOuter');
        function update() {
          var overflows = wrap.scrollHeight > wrap.clientHeight + 4;
          var atTop     = wrap.scrollTop <= 4;
          var atBottom  = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 4;
          outer.classList.toggle('show-top-fade',    overflows && !atTop);
          outer.classList.toggle('show-bottom-fade', overflows && !atBottom);
        }
        wrap.addEventListener('scroll', update);
        wrap._updateFade = update;
        update();
      }

      // ── Init ─────────────────────────────────────────────────────
      window.addEventListener('load', function() {
        loadData();
        setupColumnFilters();
        setupTableFade();
      });
    </script>
  </body>
</html>
